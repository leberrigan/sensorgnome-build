name: Build package

on:
  workflow_call:
    inputs:
      command:
        required: false
        type: string
        default: ./gen-package.sh
      repo_bucket:
        required: false
        type: string
        default: sensorgnome-982081078525-us-east-1-an
      repo_region:
        required: false
        type: string
        default: us-east-1
      repo_codename:
        required: false
        type: string
        default: booktest
      aws_role:
        required: false
        type: string
        default: arn:aws:iam::982081078525:role/GitHub-automations
      dependency:
        required: false
        type: string
        default: ""
      gpg_key_id:
        required: false
        type: string
        default: 1DC0C66E4594570A
    secrets:
      GPG_PRIVATE_KEY:
        required: true
      GPG_PASSPHRASE:
        required: true

permissions:
  id-token: write
  contents: write

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: .

      - name: Install PAM auth dependency
        if: inputs.dependency != ""
        run: sudo apt install -y ${{ inputs.dependency }}
      
      # To export key: gpg --list-secret-keys --keyid-format LONG; gpg --export-secret-keys --armor {your_keyId}
      - name: Install GPG key to sign package
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      
      # Upgraded to 0.11.8 dec/13/24, was 0.11.3 previously
      # - name: Install deb-s3 (ACL-safe)
      #   run: |
      #     sudo gem uninstall -aIx deb-s3 || true
      #     sudo gem install deb-s3 --no-document
      #     deb-s3 --version


      - name: Generate .deb packages
        run: ${{ inputs.command }}
        shell: bash
      
      - run: ls -ls packages

      # Upload github artifacts for debugging purposes
      - uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: packages

      - name: Configure AWS Credentials
        # See https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{inputs.aws_role}}
          role-session-name: GithubActionsMotus
          aws-region: ${{inputs.repo_region}}

      # - name: Insert .debs into repository
      #   # GPG_TTY needed to avoid `gpg: signing failed: Inappropriate ioctl for device`
      #   run: |
      #     gpg -k
      #     gpg -K
      #     deb-s3 upload --bucket=${{inputs.repo_bucket}} --s3-region=${{inputs.repo_region}} \
      #     --preserve-versions --codename=${{inputs.repo_codename}} --sign=${{inputs.gpg_key_id}} \
      #     --no-preserve-acls \
      #     packages/*.deb
      - name: Publish APT repo to S3 (modern, ACL-free)
        shell: bash
        run: |
          set -euo pipefail

          CODENAME="${{ inputs.repo_codename }}"
          BUCKET="${{ inputs.repo_bucket }}"

          # Create repo layout
          mkdir -p repo/pool/${CODENAME}
          mkdir -p repo/dists/${CODENAME}/main/binary-armhf

          # Copy packages
          cp packages/*.deb repo/pool/${CODENAME}/

          # Generate Packages metadata
          apt-ftparchive packages repo/pool/${CODENAME} \
            > repo/dists/${CODENAME}/main/binary-armhf/Packages

          gzip -kf repo/dists/${CODENAME}/main/binary-armhf/Packages

          # Generate Release file
          apt-ftparchive release repo/dists/${CODENAME} \
            > repo/dists/${CODENAME}/Release

          # Sign Release (modern InRelease format)
          gpg --default-key "${{ inputs.gpg_key_id }}" \
              --batch --yes \
              --clearsign \
              -o repo/dists/${CODENAME}/InRelease \
              repo/dists/${CODENAME}/Release

          # Upload to S3 (NO ACLs involved)
          aws s3 sync repo/ "s3://${BUCKET}/" --delete
